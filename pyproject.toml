[project]
name = "hr-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "cryptography>=50.0.2",
    "fastapi>=0.156.2",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-redis>=0.5.2",
    "mcp[cli]>=1.9,<2",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pymysql>=1.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.5",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
